name: Deploy to GitHub Pages

# Publishes main to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Deploy from a branch → gh-pages / root). Pull request
# previews live alongside it in gh-pages/pr-preview/ (see preview.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Serve files as-is, without GitHub's Jekyll processing.
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Replace the old build but keep the pull request previews.
          clean-exclude: pr-preview/
          # Rebase rather than overwrite, so a preview deployed at the same moment isn't lost.
          force: false
          attempt-limit: 10
