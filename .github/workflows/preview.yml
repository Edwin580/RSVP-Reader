name: Deploy PR preview

# Builds each pull request to gh-pages/pr-preview/pr-<number>/ and comments
# the link (with a QR code for phones) on the PR. The preview is removed
# when the PR is closed or merged.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Forks can't write to this repo's gh-pages branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          # Marks the build as a preview: its own storage, no offline cache, a label in the library.
          VITE_PREVIEW: ${{ github.event.number }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
